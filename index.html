<header class="hero"><div class="shell"><span class="eyebrow" data-en="PRODUCT ANALYSIS • TEAM REVIEW" data-it="ANALISI PRODOTTO • REVIEW DEL TEAM" data-fa="تحلیل محصول • بررسی تیم"></span><h1 data-en="The right crew for the right yacht." data-it="L’equipaggio giusto per lo yacht giusto." data-fa="خدمه مناسب برای یات مناسب."></h1><p data-en="Yacht Match is a two-sided recruitment platform for the yachting industry, designed to match crew members and yacht owners using professional, behavioral and onboard-lifestyle compatibility — not CVs alone." data-it="Yacht Match è una piattaforma di recruiting a due lati per il settore yachting, pensata per abbinare membri dell’equipaggio e armatori usando compatibilità professionale, comportamentale e di vita a bordo — non solo il CV." data-fa="Yacht Match یک پلتفرم دوطرفه استخدام در صنعت یات است که خدمه و مالکان یات را بر اساس سازگاری حرفه‌ای، رفتاری و سبک زندگی روی عرشه با هم تطبیق می‌دهد — نه فقط بر اساس رزومه."></p><nav class="nav"><a href="#overview" data-en="Overview" data-it="Panoramica" data-fa="مرور کلی"></a><a href="#problem" data-en="Problem" data-it="Problema" data-fa="مسئله"></a><a href="#flow" data-en="Product Flow" data-it="Flusso" data-fa="جریان محصول"></a><a href="#matching" data-en="Matching" data-it="Matching" data-fa="تطبیق"></a><a href="#mvp" data-en="MVP" data-it="MVP" data-fa="MVP"></a><a href="#risks" data-en="Risks" data-it="Rischi" data-fa="ریسک‌ها"></a><a href="#questions" data-en="Open Questions" data-it="Domande aperte" data-fa="سؤال‌های باز"></a></nav></div></header>

<section id="overview"><div class="shell"><div class="head"><div class="kicker" data-en="01 — Product definition" data-it="01 — Definizione del prodotto" data-fa="۰۱ — تعریف محصول"></div><h2 data-en="What Yacht Match is" data-it="Cos’è Yacht Match" data-fa="Yacht Match چیست"></h2></div><div class="grid3"><div class="card"><div class="icon">⚓</div><h3 data-en="Two-sided marketplace" data-it="Marketplace a due lati" data-fa="بازار دوطرفه"></h3><p data-en="Crew members on one side; yacht owners and hiring decision-makers on the other." data-it="Membri dell’equipaggio da una parte; armatori e decisori di assunzione dall’altra." data-fa="در یک سمت اعضای خدمه و در سمت دیگر مالکان یات و تصمیم‌گیرندگان استخدام قرار دارند."></p></div><div class="card"><div class="icon">🧭</div><h3 data-en="Assessment-led profiles" data-it="Profili basati su assessment" data-fa="پروفایل‌های مبتنی بر ارزیابی"></h3><p data-en="Experience, certifications, availability, personality, stress management, leadership and onboard preferences." data-it="Esperienza, certificazioni, disponibilità, personalità, gestione dello stress, leadership e preferenze a bordo." data-fa="تجربه، گواهی‌ها، زمان در دسترس بودن، شخصیت، مدیریت استرس، رهبری و ترجیحات زندگی روی عرشه."></p></div><div class="card"><div class="icon">✨</div><h3 data-en="Compatibility matching" data-it="Matching di compatibilità" data-fa="تطبیق بر اساس سازگاری"></h3><p data-en="The system recommends jobs or people that are more likely to be a real fit — not simply keyword matches." data-it="Il sistema raccomanda lavori o persone con maggiore probabilità di essere davvero compatibili." data-fa="سیستم فرصت‌های شغلی یا افرادی را پیشنهاد می‌دهد که احتمال سازگاری واقعی بیشتری دارند."></p></div></div></div></section>
<section id="problem"><div class="shell"><div class="head"><div class="kicker" data-en="02 — Problem → Solution" data-it="02 — Problema → Soluzione" data-fa="۰۲ — مسئله ← راه‌حل"></div><h2 data-en="The product attacks mismatch, not just discovery" data-it="Il prodotto affronta il mismatch, non solo la ricerca" data-fa="محصول فقط جست‌وجو را حل نمی‌کند؛ هدف اصلی کاهش عدم‌تطابق است"></h2></div><div class="compare"><div><h3 data-en="Traditional crew search" data-it="Ricerca tradizionale" data-fa="جست‌وجوی سنتی خدمه"></h3><ul><li><span class="bad">✕</span> <span data-en="Dozens of generic CVs" data-it="Decine di CV generici" data-fa="ده‌ها رزومه عمومی"></span></li><li><span class="bad">✕</span> <span data-en="Hours spent screening" data-it="Ore di screening" data-fa="ساعت‌ها زمان برای غربالگری"></span></li><li><span class="bad">✕</span> <span data-en="Hire first, discover fit later" data-it="Assumi prima, scopri il fit dopo" data-fa="اول استخدام، بعد کشف سازگاری"></span></li></ul></div><div><h3 data-en="Yacht Match promise" data-it="Promessa di Yacht Match" data-fa="وعده Yacht Match"></h3><ul><li><span class="good">✓</span> <span data-en="Pre-profiled candidates" data-it="Candidati già profilati" data-fa="کاندیداهای از پیش پروفایل‌شده"></span></li><li><span class="good">✓</span> <span data-en="Algorithm-assisted shortlist" data-it="Shortlist assistita dall’algoritmo" data-fa="لیست کوتاه با کمک الگوریتم"></span></li><li><span class="good">✓</span> <span data-en="More context about onboard compatibility" data-it="Più contesto sulla compatibilità a bordo" data-fa="اطلاعات بیشتر درباره سازگاری روی عرشه"></span></li></ul></div></div></div></section>
<section id="users"><div class="shell"><div class="head"><div class="kicker" data-en="03 — Primary users" data-it="03 — Utenti principali" data-fa="۰۳ — کاربران اصلی"></div><h2 data-en="Two users, two different jobs-to-be-done" data-it="Due utenti, due job-to-be-done diversi" data-fa="دو نوع کاربر، با دو نیاز اصلی متفاوت"></h2></div><div class="grid2"><div class="card"><div class="icon">👤</div><h3 data-en="Crew member" data-it="Membro Crew" data-fa="عضو خدمه"></h3><p data-en="Needs to understand which roles and yachts fit their background, availability, preferences and way of working — especially if new to the industry." data-it="Deve capire quali ruoli e yacht sono adatti alla propria esperienza, disponibilità e preferenze." data-fa="باید بداند چه نقش‌ها و چه یات‌هایی با سابقه، زمان در دسترس بودن، ترجیحات و سبک کاری او سازگار است."></p></div><div class="card"><div class="icon">🛥️</div><h3 data-en="Owner / hiring side" data-it="Armatore / lato hiring" data-fa="مالک / سمت استخدام"></h3><p data-en="Needs a faster way to identify credible, compatible candidates and reduce bad-fit hiring risk." data-it="Ha bisogno di un modo più rapido per trovare candidati credibili e compatibili." data-fa="نیاز دارد سریع‌تر کاندیداهای معتبر و سازگار را شناسایی کند و ریسک استخدام نامناسب را کاهش دهد."></p></div></div></div></section>
<section id="flow"><div class="shell"><div class="head"><div class="kicker" data-en="04 — Core product flow" data-it="04 — Flusso principale" data-fa="۰۴ — جریان اصلی محصول"></div><h2 data-en="From profile to conversation" data-it="Dal profilo alla conversazione" data-fa="از پروفایل تا مکالمه"></h2></div><div class="flow"><div class="step"><span class="num">1</span><h3 data-en="Choose role" data-it="Scegli il ruolo" data-fa="انتخاب نقش"></h3><p data-en="Crew member or owner." data-it="Crew member o armatore." data-fa="عضو خدمه یا مالک."></p></div><div class="step"><span class="num">2</span><h3 data-en="Build profile" data-it="Crea il profilo" data-fa="ساخت پروفایل"></h3><p data-en="Experience, yacht history, certifications and availability." data-it="Esperienza, storico yacht, certificazioni e disponibilità." data-fa="تجربه، سابقه یات، گواهی‌ها و زمان در دسترس بودن."></p></div><div class="step"><span class="num">3</span><h3 data-en="Complete assessment" data-it="Completa l’assessment" data-fa="تکمیل ارزیابی"></h3><p data-en="Behavior, stress, leadership, conflict and onboard lifestyle." data-it="Comportamento, stress, leadership, conflitti e vita a bordo." data-fa="رفتار، استرس، رهبری، تعارض و سبک زندگی روی عرشه."></p></div><div class="step"><span class="num">4</span><h3 data-en="Receive matches" data-it="Ricevi i match" data-fa="دریافت Matchها"></h3><p data-en="Recommended jobs or candidates with match signals." data-it="Lavori o candidati raccomandati." data-fa="فرصت‌های شغلی یا کاندیداهای پیشنهادی."></p></div><div class="step"><span class="num">5</span><h3 data-en="Review details" data-it="Valuta i dettagli" data-fa="بررسی جزئیات"></h3><p data-en="Salary, location, dates, description and fit context." data-it="Salario, luogo, date, descrizione e contesto di fit." data-fa="حقوق، موقعیت، تاریخ‌ها، توضیحات و زمینه سازگاری."></p></div><div class="step"><span class="num">6</span><h3 data-en="Message directly" data-it="Messaggio diretto" data-fa="پیام مستقیم"></h3><p data-en="Move from interest to interview without external intermediaries." data-it="Dall’interesse al colloquio senza intermediari esterni." data-fa="حرکت از علاقه‌مندی به مصاحبه بدون واسطه خارجی."></p></div></div></div></section>
<section id="assessment"><div class="shell"><div class="head"><div class="kicker" data-en="05 — Assessment structure" data-it="05 — Struttura assessment" data-fa="۰۵ — ساختار ارزیابی"></div><h2 data-en="A three-level profile" data-it="Un profilo su tre livelli" data-fa="پروفایل سه‌سطحی"></h2></div><div class="grid3"><div class="card soft"><h3 data-en="Level 1 — Onboarding" data-it="Livello 1 — Onboarding" data-fa="سطح ۱ — Onboarding"></h3><p data-en="Role, experience, vessel type, employment dates and current status." data-it="Ruolo, esperienza, tipo di imbarcazione, date e stato attuale." data-fa="نقش، تجربه، نوع شناور، تاریخ‌های استخدام و وضعیت فعلی."></p></div><div class="card soft"><h3 data-en="Level 2 — Role profile" data-it="Livello 2 — Profilo ruolo" data-fa="سطح ۲ — پروفایل نقش"></h3><p data-en="Communication under pressure, leadership and conflict handling." data-it="Comunicazione sotto pressione, leadership e gestione dei conflitti." data-fa="ارتباط در فشار، سبک رهبری و مدیریت تعارض."></p></div><div class="card soft"><h3 data-en="Level 3 — Advanced evaluation" data-it="Livello 3 — Valutazione avanzata" data-fa="سطح ۳ — ارزیابی پیشرفته"></h3><p data-en="Real scenarios, difficult decisions and open-ended responses." data-it="Scenari reali, decisioni difficili e risposte aperte." data-fa="سناریوهای واقعی، تصمیم‌های دشوار و پاسخ‌های باز."></p></div></div></div></section>
<section id="matching"><div class="shell"><div class="head"><div class="kicker" data-en="06 — Matching logic" data-it="06 — Logica di matching" data-fa="۰۶ — منطق Matching"></div><h2 data-en="The matching engine should be explainable" data-it="Il matching dovrebbe essere spiegabile" data-fa="موتور Matching باید قابل توضیح باشد"></h2><p class="sub" data-en="The percentages below are illustrative product-design assumptions, not confirmed business rules." data-it="Le percentuali sotto sono ipotesi illustrative, non regole confermate." data-fa="درصدهای زیر صرفاً نمونه طراحی محصول هستند و قانون قطعی کسب‌وکار محسوب نمی‌شوند."></p></div><div class="grid2"><div class="card"><h3 data-en="Illustrative scoring model" data-it="Esempio di scoring" data-fa="نمونه مدل امتیازدهی"></h3><div class="meter"><span data-en="Skills" data-it="Competenze" data-fa="مهارت‌ها"></span><div class="track"><div class="fill" style="width:35%"></div></div><strong>35%</strong></div><div class="meter"><span data-en="Experience" data-it="Esperienza" data-fa="تجربه"></span><div class="track"><div class="fill" style="width:20%"></div></div><strong>20%</strong></div><div class="meter"><span data-en="Certifications" data-it="Certificazioni" data-fa="گواهی‌ها"></span><div class="track"><div class="fill" style="width:15%"></div></div><strong>15%</strong></div><div class="meter"><span data-en="Availability" data-it="Disponibilità" data-fa="زمان در دسترس بودن"></span><div class="track"><div class="fill" style="width:10%"></div></div><strong>10%</strong></div><div class="meter"><span data-en="Preferences" data-it="Preferenze" data-fa="ترجیحات"></span><div class="track"><div class="fill" style="width:10%"></div></div><strong>10%</strong></div><div class="meter"><span data-en="Behavioral fit" data-it="Fit comportamentale" data-fa="سازگاری رفتاری"></span><div class="track"><div class="fill" style="width:10%"></div></div><strong>10%</strong></div></div><div class="card dark"><h3 data-en="Recommended UX principle" data-it="Principio UX raccomandato" data-fa="اصل پیشنهادی UX"></h3><p data-en="Do not show only “High Match”. Explain why: experience fits, availability overlaps, yacht size matches, one certification missing." data-it="Non mostrare solo “High Match”. Spiega il perché: esperienza adatta, disponibilità compatibile, dimensione yacht coerente, una certificazione mancante." data-fa="فقط «High Match» نشان ندهید؛ دلیلش را توضیح دهید: تجربه مناسب است، زمان در دسترس بودن هم‌پوشانی دارد، اندازه یات منطبق است و یک گواهی کم است."></p></div></div></div></section>
<section id="mvp"><div class="shell"><div class="head"><div class="kicker" data-en="07 — MVP scope" data-it="07 — Scope MVP" data-fa="۰۷ — محدوده MVP"></div><h2 data-en="What should exist in the first credible version" data-it="Cosa dovrebbe esserci nella prima versione credibile" data-fa="در اولین نسخه قابل‌اعتماد چه چیزهایی باید وجود داشته باشد"></h2></div><div class="table"><table><thead><tr><th data-en="Capability" data-it="Funzionalità" data-fa="قابلیت"></th><th data-en="Priority" data-it="Priorità" data-fa="اولویت"></th><th data-en="Why it matters" data-it="Perché conta" data-fa="چرا مهم است"></th></tr></thead><tbody><tr><td data-en="Crew / Owner onboarding" data-it="Onboarding Crew / Armatore" data-fa="Onboarding خدمه / مالک"></td><td><span class="tag must">MUST</span></td><td data-en="Defines marketplace sides and profile logic." data-it="Definisce i due lati e la logica dei profili." data-fa="دو سمت بازار و منطق پروفایل‌ها را مشخص می‌کند."></td></tr><tr><td data-en="Structured crew profile" data-it="Profilo crew strutturato" data-fa="پروفایل ساختاریافته خدمه"></td><td><span class="tag must">MUST</span></td><td data-en="Creates reliable matching data." data-it="Crea dati affidabili per il matching." data-fa="داده قابل‌اعتماد برای Matching ایجاد می‌کند."></td></tr><tr><td data-en="Assessment questionnaire" data-it="Questionario assessment" data-fa="پرسشنامه ارزیابی"></td><td><span class="tag must">MUST</span></td><td data-en="Core differentiation beyond CV search." data-it="Differenziazione oltre il CV." data-fa="تمایز اصلی فراتر از جست‌وجوی رزومه."></td></tr><tr><td data-en="Rule-based match score" data-it="Match score rule-based" data-fa="امتیاز Match مبتنی بر قواعد"></td><td><span class="tag must">MUST</span></td><td data-en="Enough to validate value before complex AI." data-it="Basta per validare il valore prima di AI complessa." data-fa="برای اعتبارسنجی ارزش پیش از AI پیچیده کافی است."></td></tr><tr><td data-en="Recommended matches feed" data-it="Feed match raccomandati" data-fa="فید Matchهای پیشنهادی"></td><td><span class="tag must">MUST</span></td><td data-en="Delivers core user value." data-it="Eroga il valore principale." data-fa="ارزش اصلی محصول را به کاربر می‌رساند."></td></tr><tr><td data-en="Direct messaging" data-it="Messaggistica diretta" data-fa="پیام‌رسانی مستقیم"></td><td><span class="tag must">MUST</span></td><td data-en="Connects discovery to interview." data-it="Collega discovery e colloquio." data-fa="جست‌وجو را به مصاحبه متصل می‌کند."></td></tr><tr><td data-en="Explainable match reasons" data-it="Motivi di match spiegabili" data-fa="دلایل قابل توضیح برای Match"></td><td><span class="tag should">SHOULD</span></td><td data-en="Improves trust." data-it="Aumenta la fiducia." data-fa="اعتماد به پیشنهادها را افزایش می‌دهد."></td></tr><tr><td data-en="Advanced ML model" data-it="Modello ML avanzato" data-fa="مدل پیشرفته ML"></td><td><span class="tag later">LATER</span></td><td data-en="Needs real outcome data." data-it="Richiede dati reali sugli outcome." data-fa="به داده واقعی از نتایج استخدام نیاز دارد."></td></tr></tbody></table></div></div></section>
<section id="risks"><div class="shell"><div class="head"><div class="kicker" data-en="08 — Product risks" data-it="08 — Rischi di prodotto" data-fa="۰۸ — ریسک‌های محصول"></div><h2 data-en="What can break the value proposition" data-it="Cosa può rompere la proposta di valore" data-fa="چه چیزهایی می‌توانند ارزش پیشنهادی محصول را تضعیف کنند"></h2></div><div class="grid3"><div class="card risk"><h3 data-en="Cold start" data-it="Cold start" data-fa="Cold Start"></h3><p data-en="A two-sided marketplace fails if one side finds too little relevant inventory." data-it="Un marketplace a due lati soffre se una parte trova troppo poca inventory rilevante." data-fa="یک بازار دوطرفه زمانی آسیب می‌بیند که یکی از دو سمت گزینه‌های مرتبط کافی پیدا نکند."></p></div><div class="card risk"><h3 data-en="Weak matching trust" data-it="Scarsa fiducia nel matching" data-fa="اعتماد ضعیف به Matching"></h3><p data-en="If “High Match” feels arbitrary, users will ignore the algorithm." data-it="Se “High Match” sembra arbitrario, gli utenti ignoreranno l’algoritmo." data-fa="اگر «High Match» تصادفی یا نامفهوم به نظر برسد، کاربران الگوریتم را نادیده می‌گیرند."></p></div><div class="card risk"><h3 data-en="Assessment fatigue" data-it="Affaticamento da assessment" data-fa="خستگی ناشی از ارزیابی"></h3><p data-en="Long questionnaires may improve data but hurt onboarding completion." data-it="Questionari lunghi possono migliorare i dati ma ridurre il completamento." data-fa="پرسشنامه طولانی می‌تواند کیفیت داده را بالا ببرد اما نرخ تکمیل Onboarding را کاهش دهد."></p></div></div><div class="note" style="margin-top:18px" data-en="Launch recommendation: start with a narrow geography, role cluster or hiring segment rather than the whole market." data-it="Raccomandazione: partire da una geografia o segmento ristretto, non da tutto il mercato." data-fa="پیشنهاد برای شروع: به‌جای کل بازار، از یک منطقه جغرافیایی یا بخش استخدامی محدود شروع شود."></div></div></section>
<section id="kpis"><div class="shell"><div class="head"><div class="kicker" data-en="09 — Success metrics" data-it="09 — Metriche di successo" data-fa="۰۹ — معیارهای موفقیت"></div><h2 data-en="Measure hiring quality, not just activity" data-it="Misurare la qualità dell’assunzione, non solo l’attività" data-fa="کیفیت استخدام را بسنجید، نه فقط میزان فعالیت را"></h2></div><div class="grid4"><div class="card"><h3>Match → Conversation</h3><p data-en="Are recommendations relevant enough to start contact?" data-it="Le raccomandazioni generano contatto?" data-fa="آیا پیشنهادها آن‌قدر مرتبط هستند که به شروع تماس منجر شوند؟"></p></div><div class="card"><h3>Conversation → Interview</h3><p data-en="Does interaction become a real hiring process?" data-it="L’interazione diventa un vero processo di hiring?" data-fa="آیا تعامل وارد یک فرایند واقعی استخدام می‌شود؟"></p></div><div class="card"><h3>Interview → Hire</h3><p data-en="Does the platform create successful placements?" data-it="La piattaforma genera placement reali?" data-fa="آیا پلتفرم واقعاً به استخدام موفق منجر می‌شود؟"></p></div><div class="card dark"><h3 data-en="30/60/90-day retention" data-it="Retention 30/60/90 giorni" data-fa="ماندگاری ۳۰/۶۰/۹۰ روزه"></h3><p data-en="Best proof that compatibility is more than marketing." data-it="La prova migliore che la compatibilità è più del marketing." data-fa="بهترین مدرک برای اینکه سازگاری فقط یک ادعای بازاریابی نیست."></p></div></div></div></section>
<section id="questions"><div class="shell"><div class="head"><div class="kicker" data-en="10 — Team decisions" data-it="10 — Decisioni del team" data-fa="۱۰ — تصمیم‌های تیم"></div><h2 data-en="Open questions worth resolving before build" data-it="Domande da chiarire prima dello sviluppo" data-fa="سؤال‌هایی که بهتر است پیش از توسعه پاسخ داده شوند"></h2></div><div class="card"><div class="question"><div class="qnum">1</div><div><strong data-en="What exactly creates the match score?" data-it="Cosa genera esattamente il match score?" data-fa="امتیاز Match دقیقاً بر چه اساسی ساخته می‌شود؟"></strong><div class="sub" data-en="Define hard requirements, soft preferences and behavioral weights." data-it="Definire requisiti, preferenze e pesi comportamentali." data-fa="الزامات قطعی، ترجیحات نرم و وزن عوامل رفتاری باید مشخص شوند."></div></div></div><div class="question"><div class="qnum">2</div><div><strong data-en="Is a match mutual, or a recommendation?" data-it="Il match è reciproco o una raccomandazione?" data-fa="Match دوطرفه است یا صرفاً یک پیشنهاد؟"></strong><div class="sub" data-en="Clarify recommendation, interest, match request and accepted match." data-it="Chiarire raccomandazione, interesse, richiesta e match accettato." data-fa="تفاوت بین پیشنهاد، علاقه‌مندی، درخواست Match و Match پذیرفته‌شده باید روشن شود."></div></div></div><div class="question"><div class="qnum">3</div><div><strong data-en="What can each side see before contact?" data-it="Cosa può vedere ogni lato prima del contatto?" data-fa="هر طرف پیش از تماس چه اطلاعاتی می‌تواند ببیند؟"></strong><div class="sub" data-en="Privacy, visibility and verification rules should be explicit." data-it="Privacy, visibilità e verifica devono essere esplicite." data-fa="قواعد حریم خصوصی، سطح نمایش اطلاعات و Verification باید صریح باشند."></div></div></div><div class="question"><div class="qnum">4</div><div><strong data-en="How are beginners scored without yacht experience?" data-it="Come vengono valutati i beginner senza esperienza?" data-fa="تازه‌واردها بدون سابقه یات چگونه امتیاز می‌گیرند؟"></strong><div class="sub" data-en="The product targets newcomers, so the model needs a fair path for them." data-it="Il prodotto punta ai nuovi arrivati, quindi serve un percorso equo." data-fa="محصول تازه‌واردها را هم هدف گرفته، پس مدل باید مسیر منصفانه‌ای برای آن‌ها داشته باشد."></div></div></div><div class="question"><div class="qnum">5</div><div><strong data-en="What is the revenue model at launch?" data-it="Qual è il modello di ricavo al lancio?" data-fa="مدل درآمدی در زمان لانچ چیست؟"></strong><div class="sub" data-en="Crew subscription, owner subscription, pay-per-hire, or hybrid?" data-it="Abbonamento crew, armatore, pay-per-hire o ibrido?" data-fa="اشتراک خدمه، اشتراک مالک، پرداخت به‌ازای استخدام یا مدل ترکیبی؟"></div></div></div></div></div></section>
</main>
<footer><div class="shell"><strong>Yacht Match — Product Review</strong><br><span data-en="Prepared from the supplied product screenshots. Comments are currently stored only in this browser." data-it="Preparato dagli screenshot forniti. I commenti sono attualmente salvati solo in questo browser." data-fa="این گزارش بر اساس اسکرین‌شات‌های ارائه‌شده تهیه شده است. کامنت‌ها فعلاً فقط در همین مرورگر ذخیره می‌شوند."></span></div></footer>
<script>
let current='en';function T(){if(current==='fa')return{title:'نظر تیم',ph:'یک نظر کوتاه بنویسید…',post:'ارسال',empty:'هنوز نظری ثبت نشده است.',name:'عضو تیم'};if(current==='it')return{title:'Commenti del team',ph:'Scrivi un commento breve…',post:'Pubblica',empty:'Nessun commento ancora.',name:'Team member'};return{title:'Team comments',ph:'Write a short comment…',post:'Post',empty:'No comments yet.',name:'Team member'}}function lang(l){current=l;document.documentElement.lang=l;document.documentElement.dir=l==='fa'?'rtl':'ltr';document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[l]);['en','it','fa'].forEach(x=>document.getElementById(x).classList.toggle('active',x===l));localStorage.setItem('ym_lang',l);labels()}function labels(){const t=T();document.querySelectorAll('.comments').forEach(b=>{b.querySelector('.ctitle').textContent=t.title;b.querySelector('.cinput').placeholder=t.ph;b.querySelector('.cbtn').textContent=t.post;render(b)})}function build(){document.querySelectorAll('main section').forEach((s,i)=>{const sh=s.querySelector('.shell'),b=document.createElement('div');b.className='comments';b.dataset.i=i;b.innerHTML='<div class="ctitle"></div><div class="composer"><div class="avatar">T</div><div class="cmain"><textarea class="cinput"></textarea><div class="cactions"><button class="cbtn"></button></div></div></div><div class="thread"></div>';sh.appendChild(b);b.querySelector('.cbtn').onclick=()=>post(b)});labels()}function post(b){const i=b.querySelector('.cinput'),v=i.value.trim();if(!v)return;const k='ym_comments_'+b.dataset.i,a=JSON.parse(localStorage.getItem(k)||'[]');a.unshift({text:v,ts:Date.now()});localStorage.setItem(k,JSON.stringify(a));i.value='';render(b)}function render(b){const t=T(),k='ym_comments_'+b.dataset.i,a=JSON.parse(localStorage.getItem(k)||'[]'),th=b.querySelector('.thread');if(!a.length){th.innerHTML='<div class="empty">'+t.empty+'</div>';return}th.innerHTML=a.map(x=>{const d=new Date(x.ts).toLocaleString(current==='fa'?'fa-IR':current==='it'?'it-IT':'en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}),safe=x.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');return '<div class="postitem"><div class="avatar">T</div><div><div class="meta"><strong>'+t.name+'</strong> · '+d+'</div><div>'+safe+'</div></div></div>'}).join('')}lang(localStorage.getItem('ym_lang')||'en');build();
</script>
