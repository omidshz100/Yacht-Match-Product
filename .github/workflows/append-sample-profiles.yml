name: Append sample profiles
on:
  workflow_dispatch:
  push:
    paths:
      - 'sample-profiles.js'
      - 'product-insights.js'
      - '.github/workflows/append-sample-profiles.yml'
permissions:
  contents: write
jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add sample profiles and product insights scripts to index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          sample='<script src="/sample-profiles.js"></script>'
          insights='<script src="/product-insights.js"></script>'
          anchor='<script src="/firebase-comments.js"></script>'
          if sample not in s:
              s=s.replace(anchor, sample+'\n'+anchor)
          if insights not in s:
              s=s.replace(anchor, insights+'\n'+anchor)
          p.write_text(s)
          PY
      - name: Commit index update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Append product insights to sample profiles'
          git push
